le:'About this service',about:'Civil preparedness is an independent tool for preparation and action plans. It is not operated by the Danish Emergency Management Agency or other authorities. It does not issue alerts, assess threat levels or determine whether an incident was caused by an attack.',hybridTitle:'What do hybrid threats mean for your preparation?',hybrid:'Sabotage, cyberattacks and disinformation can form part of hybrid threats. As an individual, you can strengthen your ability to handle the consequences: maintain contact, avoid spreading unconfirmed messages and cope with service outages. This tool supports those actions; it does not identify an attacker.',sourceChecked:'Guidance reviewed on 21 October 2026',footerText:'Household preparation and action plans. An independent tool linking to Danish authorities.',privacy:'Privacy',print:'Print my agreement',printAll:'Print agreement and action plans',actionsTitle:'When something fails',actionsIntro:'Choose what you are experiencing. Find actions to take now and things to prepare in advance.',now:'When it happens',before:'Prepare in advance',danger:'For immediate danger to life or serious injury: call 112. Do not use the emergency number for routine service information.',cause:'Respond to the consequences. The cause may be a technical fault, weather or a deliberate act; this guidance does not determine the cause.',related:'View household agreement',official:'Follow current instructions from authorities and your provider',save:'Save agreement',saved:'Your agreement is saved on this device.',unsaved:'You have changes that have not been saved.',storageError:'Your browser cannot save. Print or save an offline copy before closing the page.',planTitle:'An agreement you can use without a phone',planIntro:'Discuss it with the people you live with. Choose places and contact routes that work for you, and keep the agreement available without internet.',planSection:'Contact and meeting places',fields:['First meeting plac nnot confirm it is genuine.',messageQuestions:['Have you checked the message through a known, independent channel to the sender?','Do the date and context match the current situation?','Does it request codes, a login, payment or very urgent action?'],yes:'Yes',no:'No',unsure:'Not sure',review:'Show next steps',reviewIncomplete:'Answer all three questions first.',reviewTitle:'Check the sender before you act',reviewBody:'Your answers cannot establish authenticity. Go to the sender’s known website yourself or call a number you find independently of the message.',reviewRisk:'You indicated a request for sensitive details or urgent action. This is a warning sign. Do not share codes or approve an unexpected request.',reviewDate:'The date or context is unclear. An old or genuine message can be shared in a misleading context.',reviewConfirmed:'You indicated you checked the sender. This is your own statement, not technical verification by this service.',reviewShare:'Only share information you have checked, including its source and date.',noMessageStored:'You do not need to paste the message or personal details.',exerciseTitle:'Practise your decisions',exerciseIntro:'An imagined sequence with three decisions. This exercise is not a live incident or an assessment of your safety.',exerciseLabel:'Exercise · imagined incident',next:'Next situation',finish:'See your takeaways',restart:'Start again',exerciseResult:'What you can take away',exerciseResultText:'Preparation is stronger when arrangements have been tried. Choose one concrete improvement and discuss it with your household.',learned:['A contact route without internet.','A routine for checking messages.','An agreement everyone knows.'],step:'Situation',privacyTitle:'Privacy and your information',privacyIntro:'You can use the guidance without an account. Your choices and arrangements stay on this device.',privacyText:'Language, supplies, household size and saved arrangements are stored in your browser. They do not sync betwee $('view').addEventListener('change',e=>{const id=e.target.dataset.supply;if(id){S.checked=e.target.checked?[...new Set([...S.checked,id])]:S.checked.filter(x=>x!==id);store();}});
$('view').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='plan-form'){captureDraft();if(draft)S.plan={...draft};S.savedAt=new Date().toISOString();draft=null;store();$('save-status').textContent=storageOK?T('saved'):T('storageError');}if(e.target.id==='message-form'){if([0,1,2].some(i=>!messageAnswers[i])){notify(T('reviewIncomplete'));return;}reviewed=true;render();$('review-result').scrollIntoView({block:'nearest'});}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.lang){captureDraft();S.lang=b.dataset.lang;store();render();return;}if(b.dataset.incident){incident=b.dataset.incident;phase='now';go('actions');return;}if(b.dataset.phase){phase=b.dataset.phase;render();return;}if(b.hasAttribute('data-member')){const prev=S.members;S.members=Math.max(1,Math.min(20,S.members+Number(b.dataset.member)));if(S.members>prev&&S.checked.includes('water')){S.checked=S.checked.filter(x=>x!=='water');notify(T('supplyReset'));}store();render();return;}if(b.hasAttribute('data-choice')){choice=Number(b.dataset.choice);render();return;}if(b.hasAttribute('data-next')){if(drill===2){drillComplete=true;notify(T('drillDone'));}else drill++;choice=null;render();return;}if(b.hasAttribute('data-restart')){drill=0;choice=null;drillComplete=false;render();return;}if(b.hasAttribute('data-print'))printPlan();if(b.hasAttribute('data-offline'))saveOffline();if(b.hasAttribute('data-clear')&&confirm(T('clearConfirm'))){S.plan={};S.savedAt=null;draft=null;store();notify(T('cleared'));}});
window.addEventListener('online',header);window.addEventListener('offline',header);page=[...pages,'privacy'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';render();
</script>
</body></html>
